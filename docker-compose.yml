version: '3.8'

services:
  library-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/library_api
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: library-pg
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=library_api
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library_api"]
      interval: 5s
      timeout: 5s
      retries: 5
